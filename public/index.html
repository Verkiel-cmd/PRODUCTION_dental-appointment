<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grace Dental Clinic - Online Appointment Booking</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <div class="logo">
            Dental Clinic
        </div>
        <div>
            <span class="badge">● Online Booking Active</span>
        </div>
    </header>

    <div class="container">
        <div class="hero">
            <h1>Book Your Dental Appointment</h1>
            <p>Fast, easy, and confirmed via instant SMS delivery.</p>
        </div>

        <div class="booking-card">
            <!-- it was setup by its own button and what that button triggers -->
              <!-- onsubmit="event.preventDefault(); showPopup('Demo Mode: OTP Verification Sent!');"> -->
           <form id="bookingForm">
                <div class="grid">
                    <div class="form-group">
                        <label for="fullname">Full Name</label>
                        <input type="text" id="fullname" placeholder="e.g. Juan Dela Cruz" required>
                    </div>

                    <div class="form-group">
                        <label for="service">Select Service</label>
                        <select id="service" required>
                            <option value="">-- Choose Dental Service --</option>
                            <option value="cleaning">Teeth Cleaning (Prophylaxis)</option>
                            <option value="checkup">General Consultation & Checkup</option>
                            <option value="extraction">Tooth Extraction</option>
                            <option value="whitening">Teeth Whitening</option>
                            <option value="braces">Orthodontic Braces Consultation</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="date">Preferred Date</label>
                        <input type="date" id="date" required>
                    </div>

                    <div class="form-group">
                        <label for="time">Preferred Time Slot</label>
                        <select id="time" required>
                            <option value="">-- Choose Time --</option>
                            <option value="09:00">09:00 AM - 10:00 AM</option>
                            <option value="10:30">10:30 AM - 11:30 AM</option>
                            <option value="13:30">01:30 PM - 02:30 PM</option>
                            <option value="15:00">03:00 PM - 04:00 PM</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label for="phone">Mobile Number (For Instant SMS Confirmation)</label>
                    <div class="otp-box">
                        <input type="tel" id="phone" placeholder="0917XXXXXXX" required>
                         <!-- onclick="event.preventDefault(); showPopup('Demo: OTP sent to mobile number!')">Send OTP</button> -->
                        <button type="button" id="sendOTP" class="btn btn-secondary">Send OTP</button>
                    </div>
                </div>

                <div class="form-group">
                    <label for="otp">Enter 6-Digit OTP Code</label>
                    <input type="text" id="otp" placeholder="Enter code received via SMS" maxlength="6" required>
                </div>

                <button type="submit" class="btn">Confirm & Book Appointment</button>
                </form>
        </div>

        <div class="features">
            <div class="feature-item">
                <h4>OTP Verified</h4>
                <p>Instant verification of your mobile number</p>
            </div>
            <div class="feature-item">
                <h4>Instant Confirmation</h4>
                <p>Automatic SMS reminders sent</p>
            </div>
            <div class="feature-item">
                <h4>24/7 Availability</h4>
                <p>Book anytime, anywhere</p>
            </div>
        </div>
    </div>

    <div id="customPopupMessage" class="modal-overlay">
            <div class="modal">
                <p id="modalMsg">Message</p>
                <!-- it was setup by its own button and what that button triggers -->
                <button class="btn-modal" onclick="closePopupMessage()">Close</button>
            </div>
        </div>

    <script>
        //Date conevrt for Philippine Timezone
        const todayPH = new Date().toLocaleDateString('en-CA', { timeZone: 'Asia/Manila' });
        document.getElementById('date').min = todayPH;
        //SLOT 1: MESSAGE, showPopup, only called once but since the messages was called in the same function it will show the
        //code on its specific messages cos the function only called for once so each messaegs in onlclick, and onsubmit, was only called once per each specifc messages.
        function showPopup(message) {
            document.getElementById('modalMsg').textContent = message;
            document.getElementById('customPopupMessage').style.display = 'flex';
        }
        function closePopupMessage() {
            document.getElementById('customPopupMessage').style.display = 'none';
        }

        document.getElementById('sendOTP').addEventListener('click', () => {
            // Handle OTP sending logic here
            const phone = document.getElementById('phone').value;
            if (!phone || phone.length < 10) {
                showPopup("Please enter a valid mobile number");
                return;
            }
            showPopup("Demo Mode: OTP sent to " + phone + "! Please check your messages.");
        });

        document.getElementById('bookingForm').addEventListener('submit', async (event) => {
            event.preventDefault();

            const fullname = document.getElementById('fullname').value;
            const service = document.getElementById('service').value;
            const date = document.getElementById('date').value;
            const time = document.getElementById('time').value;
            const phone = document.getElementById('phone').value;
            const otp = document.getElementById('otp').value;

            const sendBookingData = async () => {
                const payload = {
                    fullname,
                    service,
                    date,
                    time,
                    phone,
                    otp
                };
                try {
                    const response = await fetch('https://dental-appointment-vozo.onrender.com/api/book-appointment', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json' },
                            body: JSON.stringify(payload)
                    });

                    const result = await response.json();

                    if (response.status === 201) {
                        showPopup('Appointment booked successfully! Confirmation sent to your mobile number.');
                        //reset the form to clear one so it looks not like a clutter
                        document.getElementById('bookingForm').reset();
                        return result.data;
                    } else {
                        showPopup(`Error: ${result.error || result.message}`);
                    }
                } catch (error) {
                    showPopup(`Error: ${error.message}`);
                }
                };

                 await sendBookingData();

            });



        
    </script>

</body>
</html>
